name: Rebuild MLB picks

# Hourly, on GitHub's servers — runs even when the Mac is off.
# Free for public repos. No API keys needed; MLB StatsAPI is public.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build site
        run: |
          python3 build.py
          python3 artifact.py > site/board.html

      # keep the graded pick history across runs
      - name: Persist graded pick history
        run: |
          git config user.name  "mlb-daily bot"
          git config user.email "actions@github.com"
          git add data/history.json
          if git diff --staged --quiet; then
            echo "no history change"
          else
            git commit -m "picks/results $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
